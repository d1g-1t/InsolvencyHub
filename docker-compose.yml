name: ${COMPOSE_PROJECT_NAME:-insolvencyhub}

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: runtime
  env_file: .env
  environment:
    IH_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ih}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-insolvency_hub}
    IH_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true

  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_HOST_PORT:-20500}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  worker:
    <<: *app
    command:
      [
        "celery",
        "-A",
        "insolvency_hub.infrastructure.worker:celery_app",
        "worker",
        "--loglevel",
        "INFO",
      ]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *app
    command:
      [
        "celery",
        "-A",
        "insolvency_hub.infrastructure.worker:celery_app",
        "beat",
        "--loglevel",
        "INFO",
        "--schedule",
        "/tmp/celerybeat-schedule",
      ]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ih}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-insolvency_hub}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ih} -d ${POSTGRES_DB:-insolvency_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    env_file: .env
    environment:
      IH_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ih}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-insolvency_hub}
      IH_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      IH_TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ih}:${POSTGRES_PASSWORD}@postgres:5432/insolvency_hub_test
      IH_TEST_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/15
      IH_PASETO_KEY_HEX: ${IH_PASETO_KEY_HEX}
      IH_ENV: test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["pytest", "-q"]

volumes:
  pgdata:
