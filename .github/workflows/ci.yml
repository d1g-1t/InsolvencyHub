name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    continue-on-error: ${{ matrix.python == '3.15' }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ih
          POSTGRES_PASSWORD: ih
          POSTGRES_DB: insolvency_hub_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ih" --health-interval 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      IH_TEST_DATABASE_URL: postgresql+asyncpg://ih:ih@localhost:5432/insolvency_hub_test
      IH_TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov --cov-report=term-missing
