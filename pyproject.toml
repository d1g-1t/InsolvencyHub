[project]
name = "insolvency-hub"
version = "1.0.0"
description = "Учет дел о банкротстве по 127-ФЗ: процедуры, реестр требований кредиторов, собрания и сроки"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "fastapi>=0.143,<0.144",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1.4",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "redis>=6.4",
    "celery[redis]>=5.6.3",
    "pyseto>=1.10",
    "bcrypt>=5.0",
    "structlog>=26.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "hypothesis>=6.170",
    "httpx>=0.28",
    "ruff>=0.17",
    "mypy>=2.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insolvency_hub"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF", "PT", "RET", "PL", "DTZ", "T20"]
ignore = ["PLR0913", "PLR0911", "PLR0912", "PLR2004", "PLR0915", "PLR0917", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLC0415"]
"scripts/**" = ["T20"]
"migrations/**" = ["E501"]
"src/insolvency_hub/api/schemas.py" = ["S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = ["integration: requires PostgreSQL and Redis (IH_TEST_DATABASE_URL, IH_TEST_REDIS_URL)"]

[tool.coverage.run]
source = ["insolvency_hub"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "pyseto.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["insolvency_hub.infrastructure.worker"]
disallow_untyped_decorators = false
